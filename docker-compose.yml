services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ab-testing-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=http://localhost:3000,http://frontend:80
    volumes:
      - ./backend/gan/checkpoints:/app/backend/gan/checkpoints:rw
      - ./backend/logs:/app/logs:rw
    networks:
      - ab-testing-network
    healthcheck:

      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: ab-testing-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ab-testing-network
    healthcheck:

      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  ab-testing-network:
    driver: bridge
