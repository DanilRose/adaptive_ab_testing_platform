services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ab-testing-backend
    # --reload: uvicorn перезапускается автоматически при изменении .py файлов
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload --log-level info
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app/backend    # исходники бекенда монтируются напрямую
      - ./backend/logs:/app/logs
    networks:
      - ab-testing-network
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: ab-testing-frontend
    working_dir: /app
    # npm install при каждом старте (на случай новых зависимостей), затем Vite dev-сервер
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app           # исходники фронтенда монтируются напрямую
      - /app/node_modules         # анонимный volume — node_modules не перезаписывается с хоста
    environment:
      - VITE_API_BASE_URL=/api/v1
    depends_on:
      - backend
    networks:
      - ab-testing-network

networks:
  ab-testing-network:
    driver: bridge
